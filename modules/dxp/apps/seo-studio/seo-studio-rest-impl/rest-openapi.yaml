components:
    schemas:
        CrawledPage:
            description: "A single crawled page returned by the SEO Studio crawler."
            properties:
                links:
                    items:
                        type: string
                    type: array
                title:
                    type: string
                url:
                    type: string
            required:
                - url
            type: object
info:
    description: "Liferay SEO Studio REST API"
    title: "SEO Studio"
    version: "v1.0"
openapi: 3.0.1
paths:
    "/crawl-hits":
        get:
            description: "Returns crawl hits from the Elasticsearch index for a given hostname."
            operationId: "getCrawlHitsPage"
            parameters:
                -   in: query
                    name: indexName
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: maxDocs
                    required: false
                    schema:
                        default: 10000
                        format: int32
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/CrawledPage"
                                type: array
                    description: "OK"
            tags: ["CrawledPage"]
